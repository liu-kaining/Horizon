theme: jekyll-theme-cayman
title: Horizon Daily
description: Your AI-powered news radar. Daily bilingual digest.
baseurl: "" # custom domain root
url: "https://horizon.thetamind.ai"

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
