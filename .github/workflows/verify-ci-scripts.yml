# Fails fast on bad scripts/CI syntax — does not need secrets or uv.
name: Verify CI scripts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check scripts/ci
        run: python -m compileall -q scripts/ci
